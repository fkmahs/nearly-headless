# work-kit CI template: copy to .github/workflows/tests.yml and replace the test step.
# CI minutes are a capped budget: PRs and pushes to main only, drafts skipped, superseded runs cancelled,
# a time cap, and recording work (.work/) never runs CI. `wk doctor` checks every repo against these rules.
name: tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: [".work/**"]
  push:
    branches: [main]
    paths-ignore: [".work/**"]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tests
        run: echo "replace with the repo's test command"
